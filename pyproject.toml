[project]
name = "kokoro-onnx"
version = "0.7.1"
description = "TTS with kokoro and onnx runtime"
readme = "README.md"
authors = [
    { name = "thewh1teagle", email = "61390950+thewh1teagle@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "onnxruntime>=1.30.0",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4.0",
    "cffi>=2.1.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
]

[project.urls]
Homepage = "https://github.com/thewh1teagle/kokoro-onnx"
Repository = "https://github.com/thewh1teagle/kokoro-onnx"
Issues = "https://github.com/thewh1teagle/kokoro-onnx/issues"

[project.optional-dependencies]
# Windows/Linux GPU feature
# Install with kokoro-onnx[gpu]
gpu = [
    # onnxruntime-gpu 1.30.0+ ships Linux aarch64 wheels; not available on macOS
    "onnxruntime-gpu>=1.30.0; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.3", "sounddevice>=0.5.6", "soundfile>=0.14.0"]

[tool.ruff]
required-version = ">=0.16.0"
output-format = "concise"
show-fixes = true

[tool.ruff.lint]
# ruff >=0.16 enables a much wider default rule set; keep the previous
# selection (ruff's pre-0.16 default + isort/pyupgrade) so vendored code
# in trim.py stays untouched
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
